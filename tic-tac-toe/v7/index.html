<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - Versão 7</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo da Velha</h1>

        <section class="setup" id="setup">
            <div class="form-group">
                <label for="mode">Modo de jogo:</label>
                <select id="mode">
                    <option value="PvP">Todos Humanos (PvP)</option>
                    <option value="PvC">Jogador 1 + Computadores (PvC)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="qty">Quantidade de jogadores:</label>
                <input type="number" id="qty" min="2" max="6" value="2">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rows">Linhas:</label>
                    <input type="number" id="rows" min="3" max="12" value="6">
                </div>
                <div class="form-group">
                    <label for="cols">Colunas:</label>
                    <input type="number" id="cols" min="3" max="12" value="7">
                </div>
                <div class="form-group">
                    <label for="win">Sequência p/ vencer:</label>
                    <input type="number" id="win" min="3" max="12" value="4">
                </div>
            </div>

            <div class="form-group gravity-option">
                <label>
                    <input type="checkbox" id="gravity">
                    Modo Gravidade (Connect Four)
                </label>
            </div>

            <div id="players-fields"></div>

            <button id="start" class="btn-start">Iniciar Jogo</button>
        </section>

        <div class="game-info" id="game-info" style="display: none;">
            <div id="matchup">Jogador 1 (X) vs. Jogador 2 (O)</div>
            <div class="scoreboard" id="scoreboard"></div>
            <button id="clear-scores" class="btn-clear">Zerar Placar</button>
        </div>

        <div id="status">Configure o jogo e clique em Iniciar.</div>

        <div class="board" id="board"></div>

        <button id="reset" class="btn-reset" style="display: none;">Novo Jogo</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
